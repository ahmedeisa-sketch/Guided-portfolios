services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: emcoin
      POSTGRES_USER: emcoin
      POSTGRES_PASSWORD: emcoin
    volumes:
      - emcoin_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emcoin -d emcoin"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgres://emcoin:emcoin@db:5432/emcoin
      PORT: 5000
      ALLOWED_ORIGINS: http://localhost:3000
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_CHALLENGE_SECRET: ${JWT_CHALLENGE_SECRET}
      TWO_FACTOR_ENCRYPTION_KEY: ${TWO_FACTOR_ENCRYPTION_KEY}
      REFRESH_COOKIE_NAME: ${REFRESH_COOKIE_NAME:-em_refresh}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-7}
      TRUST_PROXY: ${TRUST_PROXY:-false}
    command: ["sh", "-c", "npm run migrate && npm start"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 10s
      timeout: 3s
      retries: 10

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  emcoin_pgdata:
